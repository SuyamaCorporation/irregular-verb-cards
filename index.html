<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不規則動詞暗記カード</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.card-container { perspective: 1000px; }
.card { transform-style: preserve-3d; transition: transform 0.5s ease; cursor: pointer; }
.card.flipped { transform: rotateY(180deg); }
.card-front, .card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.card-back { transform: rotateY(180deg); }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-emerald-400 mb-1">📚 不規則動詞暗記カード</h1>
  <p class="text-gray-400 text-sm mb-4">英語不規則動詞（原形/過去形/過去分詞）をフラッシュカードで暗記</p>

  <!-- 統計 -->
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div class="bg-gray-900 rounded-xl p-3 text-center border border-gray-800">
      <div id="stat-correct" class="text-2xl font-bold text-green-400">0</div>
      <div class="text-xs text-gray-400">正解</div>
    </div>
    <div class="bg-gray-900 rounded-xl p-3 text-center border border-gray-800">
      <div id="stat-incorrect" class="text-2xl font-bold text-red-400">0</div>
      <div class="text-xs text-gray-400">不正解</div>
    </div>
    <div class="bg-gray-900 rounded-xl p-3 text-center border border-gray-800">
      <div id="stat-streak" class="text-2xl font-bold text-yellow-400">0</div>
      <div class="text-xs text-gray-400">🔥 ストリーク</div>
    </div>
  </div>

  <!-- フィルター & モード -->
  <div class="flex flex-wrap gap-2 mb-4">
    <div class="flex rounded-lg overflow-hidden border border-gray-700">
      <button onclick="setMode('en-en')" id="mode-en-en" aria-label="原形から過去形モード" class="px-3 py-1.5 text-xs font-semibold transition bg-emerald-600 text-white">原形→過去</button>
      <button onclick="setMode('jp-en')" id="mode-jp-en" aria-label="日本語から英語モード" class="px-3 py-1.5 text-xs font-semibold transition bg-gray-800 text-gray-300 hover:bg-gray-700">日本語→英語</button>
    </div>
    <div class="flex rounded-lg overflow-hidden border border-gray-700">
      <button onclick="setDiff('all')" id="diff-all" aria-label="全難易度" class="px-3 py-1.5 text-xs font-semibold transition bg-emerald-600 text-white">全て</button>
      <button onclick="setDiff('easy')" id="diff-easy" aria-label="初級" class="px-3 py-1.5 text-xs font-semibold transition bg-gray-800 text-gray-300 hover:bg-gray-700">初級</button>
      <button onclick="setDiff('medium')" id="diff-medium" aria-label="中級" class="px-3 py-1.5 text-xs font-semibold transition bg-gray-800 text-gray-300 hover:bg-gray-700">中級</button>
      <button onclick="setDiff('hard')" id="diff-hard" aria-label="上級" class="px-3 py-1.5 text-xs font-semibold transition bg-gray-800 text-gray-300 hover:bg-gray-700">上級</button>
    </div>
    <div id="progress-text" class="text-xs text-gray-400 self-center"></div>
  </div>

  <!-- カード -->
  <div class="card-container mb-4" style="height:220px;" onclick="flipCard()">
    <div id="flash-card" class="card relative w-full h-full" role="button" aria-label="カードをクリックして裏返す" tabindex="0">
      <div class="card-front absolute inset-0 bg-gray-900 rounded-2xl border-2 border-emerald-700 flex flex-col items-center justify-center p-6">
        <div id="card-front-label" class="text-xs text-gray-500 mb-2">原形</div>
        <div id="card-front-text" class="text-4xl font-bold text-emerald-300 mb-2">-</div>
        <div id="card-front-sub" class="text-sm text-gray-400"></div>
        <div class="absolute bottom-4 text-xs text-gray-600">タップして確認</div>
      </div>
      <div class="card-back absolute inset-0 bg-gray-900 rounded-2xl border-2 border-blue-700 flex flex-col items-center justify-center p-6">
        <div class="text-xs text-gray-500 mb-3">解答</div>
        <div id="card-back-past" class="text-2xl font-bold text-blue-300 mb-1"></div>
        <div class="text-xs text-gray-500 mb-1">過去形 → 過去分詞</div>
        <div id="card-back-pp" class="text-2xl font-bold text-purple-300 mb-2"></div>
        <div id="card-back-jp" class="text-lg text-yellow-300"></div>
      </div>
    </div>
  </div>

  <!-- 正解/不正解ボタン -->
  <div class="flex gap-3 mb-4">
    <button onclick="markAnswer(false)" aria-label="不正解" class="flex-1 py-3 bg-red-700 hover:bg-red-600 rounded-xl font-bold text-sm transition">
      ✗ 不正解
    </button>
    <button onclick="markAnswer(true)" aria-label="正解" class="flex-1 py-3 bg-green-700 hover:bg-green-600 rounded-xl font-bold text-sm transition">
      ✓ 正解
    </button>
  </div>

  <!-- 正解率バー -->
  <div class="bg-gray-900 rounded-xl p-4 border border-gray-800 mb-4">
    <h3 class="text-sm font-semibold text-gray-300 mb-3">正解率</h3>
    <div id="accuracy-bars" class="space-y-2"></div>
    <div class="mt-3 flex items-center gap-2">
      <div class="flex-1 bg-gray-800 rounded-full h-3">
        <div id="total-bar" class="bg-emerald-500 h-3 rounded-full transition-all" style="width:0%"></div>
      </div>
      <span id="total-pct" class="text-sm font-bold text-emerald-400 w-12 text-right">0%</span>
    </div>
    <div class="text-xs text-gray-500 mt-1">総合正解率</div>
  </div>

  <button onclick="resetStats()" aria-label="統計をリセット"
    class="w-full py-2 bg-gray-800 hover:bg-gray-700 rounded-xl text-sm text-gray-400 transition">
    統計リセット
  </button>
</div>

<script>
const VERBS = [
  {base:'be',past:'was/were',pp:'been',jp:'〜である',diff:'easy'},
  {base:'go',past:'went',pp:'gone',jp:'行く',diff:'easy'},
  {base:'have',past:'had',pp:'had',jp:'持つ',diff:'easy'},
  {base:'do',past:'did',pp:'done',jp:'する',diff:'easy'},
  {base:'say',past:'said',pp:'said',jp:'言う',diff:'easy'},
  {base:'see',past:'saw',pp:'seen',jp:'見る',diff:'easy'},
  {base:'get',past:'got',pp:'got/gotten',jp:'得る',diff:'easy'},
  {base:'make',past:'made',pp:'made',jp:'作る',diff:'easy'},
  {base:'come',past:'came',pp:'come',jp:'来る',diff:'easy'},
  {base:'take',past:'took',pp:'taken',jp:'取る',diff:'easy'},
  {base:'know',past:'knew',pp:'known',jp:'知る',diff:'medium'},
  {base:'think',past:'thought',pp:'thought',jp:'思う',diff:'medium'},
  {base:'give',past:'gave',pp:'given',jp:'与える',diff:'medium'},
  {base:'find',past:'found',pp:'found',jp:'見つける',diff:'medium'},
  {base:'tell',past:'told',pp:'told',jp:'伝える',diff:'medium'},
  {base:'become',past:'became',pp:'become',jp:'なる',diff:'medium'},
  {base:'leave',past:'left',pp:'left',jp:'去る/残す',diff:'medium'},
  {base:'feel',past:'felt',pp:'felt',jp:'感じる',diff:'medium'},
  {base:'put',past:'put',pp:'put',jp:'置く',diff:'medium'},
  {base:'bring',past:'brought',pp:'brought',jp:'持ってくる',diff:'medium'},
  {base:'write',past:'wrote',pp:'written',jp:'書く',diff:'medium'},
  {base:'stand',past:'stood',pp:'stood',jp:'立つ',diff:'medium'},
  {base:'hear',past:'heard',pp:'heard',jp:'聞く',diff:'medium'},
  {base:'spend',past:'spent',pp:'spent',jp:'費やす',diff:'medium'},
  {base:'run',past:'ran',pp:'run',jp:'走る',diff:'medium'},
  {base:'keep',past:'kept',pp:'kept',jp:'保つ',diff:'hard'},
  {base:'break',past:'broke',pp:'broken',jp:'壊す',diff:'hard'},
  {base:'hold',past:'held',pp:'held',jp:'持つ/握る',diff:'hard'},
  {base:'choose',past:'chose',pp:'chosen',jp:'選ぶ',diff:'hard'},
  {base:'begin',past:'began',pp:'begun',jp:'始める',diff:'hard'},
  {base:'speak',past:'spoke',pp:'spoken',jp:'話す',diff:'hard'},
  {base:'drive',past:'drove',pp:'driven',jp:'運転する',diff:'hard'},
  {base:'fly',past:'flew',pp:'flown',jp:'飛ぶ',diff:'hard'},
  {base:'throw',past:'threw',pp:'thrown',jp:'投げる',diff:'hard'},
  {base:'grow',past:'grew',pp:'grown',jp:'成長する',diff:'hard'},
  {base:'arise',past:'arose',pp:'arisen',jp:'生じる',diff:'hard'},
  {base:'freeze',past:'froze',pp:'frozen',jp:'凍る',diff:'hard'},
  {base:'forbid',past:'forbade',pp:'forbidden',jp:'禁じる',diff:'hard'},
  {base:'overtake',past:'overtook',pp:'overtaken',jp:'追い越す',diff:'hard'},
  {base:'undergo',past:'underwent',pp:'undergone',jp:'経験する',diff:'hard'},
];

let mode = 'en-en';
let diffFilter = 'all';
let cardIndex = 0;
let deck = [];
let isFlipped = false;
let stats = {};

function loadStats() {
  stats = JSON.parse(localStorage.getItem('verb-stats') || '{}');
}
function saveStats() {
  localStorage.setItem('verb-stats', JSON.stringify(stats));
}

function setMode(m) {
  mode = m;
  ['en-en','jp-en'].forEach(id => {
    document.getElementById('mode-'+id).className = `px-3 py-1.5 text-xs font-semibold transition ${id===m ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`;
  });
  buildDeck(); showCard();
}

function setDiff(d) {
  diffFilter = d;
  ['all','easy','medium','hard'].forEach(id => {
    document.getElementById('diff-'+id).className = `px-3 py-1.5 text-xs font-semibold transition ${id===d ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`;
  });
  buildDeck(); showCard();
}

function buildDeck() {
  deck = VERBS.filter(v => diffFilter === 'all' || v.diff === diffFilter);
  deck = [...deck].sort(() => Math.random() - 0.5);
  cardIndex = 0;
  document.getElementById('progress-text').textContent = `${deck.length}枚`;
}

function showCard() {
  if (!deck.length) return;
  const v = deck[cardIndex];
  const card = document.getElementById('flash-card');
  card.classList.remove('flipped');
  isFlipped = false;
  if (mode === 'en-en') {
    document.getElementById('card-front-label').textContent = '原形';
    document.getElementById('card-front-text').textContent = v.base;
    document.getElementById('card-front-sub').textContent = '';
  } else {
    document.getElementById('card-front-label').textContent = '日本語';
    document.getElementById('card-front-text').textContent = v.jp;
    document.getElementById('card-front-sub').textContent = '';
  }
  document.getElementById('card-back-past').textContent = v.past;
  document.getElementById('card-back-pp').textContent = v.pp;
  document.getElementById('card-back-jp').textContent = mode==='en-en' ? v.jp : v.base + ' / ' + v.past + ' / ' + v.pp;
  document.getElementById('progress-text').textContent = `${cardIndex+1} / ${deck.length}`;
}

function flipCard() {
  const card = document.getElementById('flash-card');
  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);
}

function markAnswer(correct) {
  if (!deck.length) return;
  const v = deck[cardIndex];
  if (!stats[v.base]) stats[v.base] = {c:0, w:0};
  if (correct) { stats[v.base].c++; } else { stats[v.base].w++; }
  saveStats();
  updateStatDisplay();
  cardIndex = (cardIndex + 1) % deck.length;
  showCard();
  updateAccuracyBars();
}

function updateStatDisplay() {
  let total_c = 0, total_w = 0, streak = 0;
  Object.values(stats).forEach(s => { total_c += s.c; total_w += s.w; });
  // simple streak from recent
  const recentBase = deck.slice(Math.max(0, cardIndex-1), cardIndex).map(v=>v.base);
  recentBase.forEach(b => {
    if (stats[b] && stats[b].c > stats[b].w) streak++;
  });
  document.getElementById('stat-correct').textContent = total_c;
  document.getElementById('stat-incorrect').textContent = total_w;
  const streakEl = document.getElementById('stat-streak');
  streakEl.textContent = total_c;
}

function updateAccuracyBars() {
  const container = document.getElementById('accuracy-bars');
  const sample = deck.slice(0, 8);
  container.innerHTML = sample.map(v => {
    const s = stats[v.base] || {c:0,w:0};
    const total = s.c + s.w;
    const pct = total ? Math.round(s.c/total*100) : 0;
    return `<div class="flex items-center gap-2">
      <span class="text-xs text-gray-400 w-20 truncate">${v.base}</span>
      <div class="flex-1 bg-gray-800 rounded-full h-2">
        <div class="bg-emerald-500 h-2 rounded-full transition-all" style="width:${pct}%"></div>
      </div>
      <span class="text-xs text-gray-400 w-8 text-right">${pct}%</span>
    </div>`;
  }).join('');

  let total_c = 0, total_w = 0;
  Object.values(stats).forEach(s => { total_c += s.c; total_w += s.w; });
  const totalPct = (total_c+total_w) ? Math.round(total_c/(total_c+total_w)*100) : 0;
  document.getElementById('total-bar').style.width = totalPct + '%';
  document.getElementById('total-pct').textContent = totalPct + '%';
}

function resetStats() {
  if (!confirm('統計をリセットしますか？')) return;
  stats = {};
  saveStats();
  updateStatDisplay();
  updateAccuracyBars();
}

document.getElementById('flash-card').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') flipCard();
});

loadStats();
buildDeck();
showCard();
updateAccuracyBars();
</script>
</body>
</html>
